<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote Generator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 1px solid #00f5ff33;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 0 40px #00f5ff22;
    }
    h1 {
      font-size: 1.5rem;
      background: linear-gradient(90deg, #00f5ff, #bf00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 30px;
    }
    .quote {
      font-size: 1.1rem;
      color: #eee;
      line-height: 1.6;
      margin-bottom: 10px;
      min-height: 60px;
    }
    .author {
      color: #00f5ff;
      font-size: 0.9rem;
      margin-bottom: 30px;
    }
    button {
      background: linear-gradient(90deg, #00f5ff, #bf00ff);
      border: none;
      color: #000;
      font-weight: bold;
      padding: 12px 30px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 1rem;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>💬 Quote Generator</h1>
    <div class="quote" id="quote">"Loading..."</div>
    <div class="author" id="author">— Unknown</div>
    <button onclick="newQuote()">New Quote ✨</button>
  </div>
  <script>
    const quotes = [
      { text: "The best way to get started is to quit talking and begin doing.", author: "Walt Disney" },
      { text: "Don't let yesterday take up too much of today.", author: "Will Rogers" },
      { text: "It's not whether you get knocked down, it's whether you get up.", author: "Vince Lombardi" },
      { text: "If you are working on something exciting, it doesn't have to be pushed. It pulls you.", author: "Steve Jobs" },
      { text: "People who are crazy enough to think they can change the world, are the ones who do.", author: "Rob Siltanen" },
      { text: "Hard work beats talent when talent doesn't work hard.", author: "Tim Notke" },
      { text: "Dream big and dare to fail.", author: "Norman Vaughan" },
      { text: "You miss 100% of the shots you don't take.", author: "Wayne Gretzky" },
      { text: "Success is not final, failure is not fatal: it is the courage to continue that counts.", author: "Winston Churchill" },
      { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
    ];
    function newQuote() {
      const q = quotes[Math.floor(Math.random() * quotes.length)];
      document.getElementById('quote').innerText = `"${q.text}"`;
      document.getElementById('author').innerText = `— ${q.author}`;
    }
    newQuote();
  </script>
</body>
</html>
